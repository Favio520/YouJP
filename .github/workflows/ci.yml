name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Instalar extensión
        run: npm ci --prefix extension
      - name: Instalar backend
        run: uv sync --locked --project backend
      - name: Revisar Python
        run: uv run --locked --project backend ruff check backend
      - name: Comprobar contrato y versiones
        run: uv run --locked --project backend python scripts/generate_contract.py --check
      - name: Probar Python
        run: uv run --locked --project backend pytest backend/tests
      - name: Compilar tipos
        run: npm run compile --prefix extension
      - name: Revisar extensión
        run: npm run lint --prefix extension
      - name: Probar extensión
        run: npm test --prefix extension
      - name: Compilar extensión
        run: npm run build --prefix extension
      - name: Revisar dependencias de npm
        run: npm audit --audit-level=high --prefix extension
      - name: Guardar extensión compilada
        uses: actions/upload-artifact@v4
        with:
          name: youjp-chrome-mv3
          path: extension/.output/chrome-mv3
          include-hidden-files: true
      - name: Comparar tramas Python y TypeScript
        run: uv run --locked --project backend python scripts/check_frame_conformance.py

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compilar lanzador e iconos
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File scripts\windows\Build-Launcher.ps1
      - name: Probar lanzador
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File scripts\windows\Test-Launcher.ps1
